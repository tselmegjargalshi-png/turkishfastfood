<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Rubik:wght@400;600;800&subset=cyrillic,cyrillic-ext,latin&display=swap" rel="stylesheet">

<style>.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;padding:24px 0 50px}.q{background:#fff;border:3px solid var(--maroon);border-radius:24px;padding:16px;text-align:center;box-shadow:0 6px 0 var(--maroon)}.q img{width:100%;border-radius:14px;background:var(--cream)}.q h3{font-family:Lobster;font-weight:400;font-size:26px;color:var(--maroon);margin:12px 0 4px}.q p{color:var(--muted);font-size:14px;margin-bottom:12px}.b{display:inline-block;padding:11px 20px;border-radius:12px;border:2px solid var(--maroon);background:var(--red);color:#fff;font:700 15px Rubik;text-decoration:none;box-shadow:0 3px 0 var(--maroon)}</style>
</head><body><div class="wrap">

<div class="q"><img src="qr_sticker.png" alt="Yuvarlak etiket"><h3>Yuvarlak Etiket</h3><p>Kapıya, bardağa ve kutuya yapıştırmak için</p><a class="b" href="qr_sticker.png" download>İndir</a></div>
</div></div></body></html>
